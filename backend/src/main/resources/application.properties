spring.application.name=backend

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}

# Connection pool warmup — keeps connections alive and avoids cold-start latency on first request
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Google OAuth Configs
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Hibernate Configs
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Defer datasource initialization so Spring Session tables are created before Hibernate runs
spring.jpa.defer-datasource-initialization=true

# Flyway Configs
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# GitHub token
github.api.token=${GH_TOKEN}

# Local directory for image uploads
app.upload.dir=./uploads

# Restriction for image upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

server.forward-headers-strategy=framework

# Session persistence — store sessions in PostgreSQL so they survive server restarts
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
# Keep users logged in for 30 days (instead of Spring's default 30 minutes)
server.servlet.session.timeout=30d
