spring.datasource.url=jdbc:postgresql://localhost:5432/scard_test
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway fails on fresh databases because V1 is empty. We rely on Hibernate to generate the test schema.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.session.jdbc.initialize-schema=always
spring.sql.init.continue-on-error=true

# Needed so we don't try to use OAuth config in tests unless mocked
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret

app.upload.dir=./uploads
github.api.token=dummy-token
app.frontend.url=http://localhost:5173
