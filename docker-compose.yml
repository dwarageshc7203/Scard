services:
  db:
    image: postgres:15-alpine
    container_name: scard_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: scard
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    # instead of racing against the startup sequence.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d scard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: scard_db_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: scard
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
    volumes:
      - db-backups:/backups

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scard_backend
    depends_on:
      db:
        condition: service_healthy   # Wait for Postgres readiness, not just container start
    environment:
      - DB_URL=jdbc:postgresql://db:5432/scard
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GH_TOKEN=${GH_TOKEN}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.5
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scard_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  db-backups:
