server {
    listen 80;
    server_name scard.dwaragesh.me;

    # MED-9: Hard limit on request body to protect the backend.
    client_max_body_size 10m;

    # MED-9: Never reveal the Spring / nginx versions.
    server_tokens off;

    # ─── Frontend (Vite static build) ────────────────────────────────────────
    root /var/www/scard/frontend/dist;
    index index.html;

    # Hashed Vite assets (fingerprinted filenames) — safe to cache forever.
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Serve the SPA for all frontend routes.
    location / {
        try_files $uri $uri/ /index.html;

        # ─── MED-8: Security headers ──────────────────────────────────────
        # CSP: script/style from self only, images from https:, frames denied.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── API proxy (Spring Boot) ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MED-9: Hide upstream server information from clients.
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # OAuth2 login flow
    location /oauth2/ {
        proxy_pass http://localhost:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login trigger
    location /login {
        proxy_pass http://localhost:8080/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logout trigger
    location /logout {
        proxy_pass http://localhost:8080/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Profile image uploads — restrict to image content types at nginx layer.
    location /uploads/ {
        proxy_pass http://localhost:8080/uploads/;
        # Only allow image responses through.
        proxy_hide_header Content-Disposition;
    }

    # ─── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
